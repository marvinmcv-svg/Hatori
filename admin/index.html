<!doctype html>
<html lang="es-BO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Hattori · Backoffice</title>
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Manrope:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form class="login__card" id="loginForm">
    <img class="brand-logo" src="/assets/brand/logo-gold.png" alt="Hattori" width="900" height="545">
    <h1>Backoffice</h1>
    <label>Correo<input type="email" name="email" autocomplete="username" required></label>
    <label>Contraseña<input type="password" name="password" autocomplete="current-password" required></label>
    <p class="err" role="alert" id="loginErr"></p>
    <button class="btn btn--red btn--block">Entrar</button>
    <p class="muted small">¿Olvidaste tu contraseña? Pídele a un administrador que la restablezca.</p>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <img class="brand-logo" src="/assets/brand/logo-gold.png" alt="Hattori" width="900" height="545">
    <nav id="nav" aria-label="Secciones"></nav>
    <div class="side__me" id="me"></div>
  </aside>
  <main class="main"><div id="view" class="view"></div></main>
</div>

<div id="notconfigured" class="login" hidden>
  <div class="login__card"><img class="brand-logo" src="/assets/brand/logo-gold.png" alt="Hattori" width="900" height="545"><h1>Falta configurar</h1>
    <p>Completa <code>supabaseUrl</code> y <code>supabaseKey</code> en <code>js/config.js</code> para activar el backoffice.</p></div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/js/data.js"></script>
<script src="/js/config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
