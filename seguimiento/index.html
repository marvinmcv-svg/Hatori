<!doctype html>
<html lang="es-BO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sigue tu Roll · Hattori</title>
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Allura&family=Manrope:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--red:#d3a334;--wine:#0b0b0b;--cream:#ededed;--cream-2:#d9d6d1;--paper:#f7f6f3;--gold:#d3a334;--ink:#1b1714;--muted:#6e645b;--wa:#25d366;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}body{margin:0;font:400 16px/1.55 Manrope,system-ui,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit}.top{background:var(--wine);color:var(--cream);padding:22px 20px 90px;text-align:center;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:auto -10% 10px -10%;height:60px;background:url(/assets/brand/brush.png) center/auto 50px repeat-x;opacity:.35}
.top>*{position:relative;z-index:1}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font:800 1.3rem/1 Fraunces,Georgia,serif;letter-spacing:.28em}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--red);display:inline-block;box-shadow:0 0 0 2px var(--cream)}
.eyebrow{font:500 .72rem/1 "IBM Plex Mono",monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:46px 0 12px}
h1{font:800 clamp(2.4rem,9vw,4rem)/1 Fraunces,Georgia,serif;margin:0}
.sub{opacity:.8;max-width:40ch;margin:14px auto 0}
.seig{height:28px;background:var(--wine) url(/assets/brand/brush.png) center/auto 26px repeat-x!important;--c:rgba(201,164,92,.55);background:radial-gradient(circle at 50% 100%,transparent 28%,var(--c) 29% 33%,transparent 34% 46%,var(--c) 47% 51%,transparent 52%) 0 0/28px 14px,radial-gradient(circle at 50% 100%,transparent 28%,var(--c) 29% 33%,transparent 34% 46%,var(--c) 47% 51%,transparent 52%) 14px 7px/28px 14px,var(--red)}
.card{max-width:560px;margin:-64px auto 40px;background:var(--paper);border-radius:24px;padding:26px;box-shadow:0 40px 80px -30px rgba(20,17,15,.45);position:relative;z-index:2}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.code{font:800 1.6rem/1 Fraunces,Georgia,serif}.code small{display:block;font:500 .7rem/1 "IBM Plex Mono",monospace;color:var(--muted);letter-spacing:.14em;margin-top:6px}
.pill{border-radius:999px;padding:7px 13px;font-weight:800;font-size:.8rem;background:var(--cream);}
.tl{list-style:none;margin:26px 0;padding:0}
.tl li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding-bottom:18px;position:relative;color:var(--muted)}
.tl li::before{content:"";position:absolute;left:13px;top:24px;bottom:0;width:2px;background:var(--cream-2)}
.tl li:last-child::before{display:none}
.tl .d{width:28px;height:28px;border-radius:50%;border:2px solid var(--cream-2);background:var(--paper);display:grid;place-items:center;font-size:.8rem}
.tl li.done{color:var(--ink)}.tl li.done .d{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.tl li.done::before{background:var(--ink)}
.tl li.now .d{background:var(--red);border-color:var(--red);color:var(--ink);animation:p 1.6s infinite}
.tl b{display:block}.tl time{font:500 .78rem/1.6 "IBM Plex Mono",monospace}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(200,55,45,.5)}70%{box-shadow:0 0 0 10px rgba(200,55,45,0)}100%{box-shadow:0 0 0 0 rgba(200,55,45,0)}}
.items{border-top:1px dashed var(--cream-2);padding-top:16px;margin:0;list-style:none;padding-left:0}
.items li{display:flex;justify-content:space-between;padding:4px 0}
.tot{display:flex;justify-content:space-between;font-weight:800;border-top:1px solid var(--cream-2);margin-top:10px;padding-top:10px;font-size:1.1rem}
.eta{background:var(--cream);border-radius:14px;padding:12px 14px;margin:18px 0;font-weight:600}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;border-radius:999px;padding:14px 20px;font-weight:800;text-decoration:none;background:var(--wa);color:#062b14;margin-top:10px}
.btn--ink{background:var(--ink);color:var(--cream)}
.cancel{background:#fbe6e3;color:#9e2a20;border-radius:14px;padding:14px;margin:20px 0}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--cream),#fff,var(--cream));background-size:200%;animation:sh 1.2s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
.foot{text-align:center;color:var(--muted);font-size:.8rem;padding:0 20px 40px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="/assets/brand/logo-gold.png" alt="Hattori" width="900" height="545" style="height:46px;width:auto"></a>
  <p class="eyebrow">Sigue tu Roll</p>
  <h1 id="h">Buscando tu pedido…</h1>
  <p class="sub" id="s">Un momento 🍣</p>
</header>
<div class="seig" aria-hidden="true"></div>
<main class="card" id="card" aria-live="polite"><div class="skel"></div><div class="skel" style="width:70%"></div><div class="skel" style="width:40%"></div></main>
<p class="foot">Esta página se actualiza sola cada 15 segundos.</p>
<script src="/js/data.js"></script>
<script src="/js/config.js"></script>
<script>
(function () {
  "use strict";
  var CFG = window.HATTORI_CONFIG || {}, B = window.HATTORI || { config: { callCenter: "59162098707", currency: "Bs" } };
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var token = new URLSearchParams(location.search).get("t") || "";
  var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  var HEAD = {
    new: ["¡Recibimos tu pedido!", "La sucursal lo está revisando."],
    confirmed: ["¡Pedido confirmado! ✨", "Ya entró a la barra de sushi."],
    preparing: ["En la barra 🍣", "Estamos armando tus rolls."],
    ready: ["¡Listo! 🥢", "Tu pedido está listo."],
    out_for_delivery: ["En camino 🛵", "Tu pedido ya salió de la sucursal."],
    delivered: ["¡Buen provecho! 🍣", "Gracias por elegir Hattori."],
    cancelled: ["Pedido cancelado", "Si tienes dudas, escríbenos."],
  };
  var LABEL = { new: "Recibido", confirmed: "Confirmado", preparing: "En la barra", ready: "Listo", out_for_delivery: "En camino", delivered: "Entregado" };
  var timer;
  function fmtTime(iso) { try { return new Date(iso).toLocaleTimeString("es-BO", { hour: "2-digit", minute: "2-digit", timeZone: "America/La_Paz" }); } catch (e) { return ""; } }
  function money(n) { return (B.config.currency || "Bs") + " " + Number(n).toLocaleString("es-BO"); }
  function notFound(why) {
    $("#h").textContent = "No encontramos ese pedido";
    $("#s").textContent = why || "Revisa el enlace que te enviamos por WhatsApp.";
    $("#card").innerHTML = '<p>Si acabas de pedir, escríbenos y te ayudamos.</p><a class="btn" href="https://wa.me/' + B.config.callCenter + '?text=' + encodeURIComponent("Hola Hattori 👋 No encuentro mi pedido") + '" target="_blank" rel="noopener">Escribir por WhatsApp</a><a class="btn btn--ink" href="/">Volver a Hattori</a>';
  }
  function render(o) {
    var h = HEAD[o.status] || HEAD.new;
    $("#h").textContent = h[0]; $("#s").textContent = (o.first_name ? o.first_name + ", " : "") + h[1].charAt(0).toLowerCase() + h[1].slice(1);
    document.title = h[0] + " · Hattori";
    var steps = o.service === "delivery" ? ["new", "confirmed", "preparing", "ready", "out_for_delivery", "delivered"] : ["new", "confirmed", "preparing", "ready", "delivered"];
    var at = {}; (o.events || []).forEach(function (e) { if (!at[e.status]) at[e.status] = e.at; });
    var cur = steps.indexOf(o.status);
    var tl = o.status === "cancelled"
      ? '<div class="cancel"><b>Este pedido fue cancelado.</b>' + (o.cancel_reason ? "<br>Motivo: " + esc(o.cancel_reason) : "") + "</div>"
      : '<ol class="tl">' + steps.map(function (s, i) {
          var cls = i < cur || (i === cur && s === "delivered") ? "done" : i === cur ? "now" : "";
          var lbl = s === "delivered" && o.service !== "delivery" ? "Entregado / retirado" : LABEL[s];
          return '<li class="' + cls + '"><span class="d">' + (cls === "done" ? "✓" : i + 1) + '</span><span><b>' + esc(lbl) + "</b></span><time>" + (at[s] ? fmtTime(at[s]) : "") + "</time></li>";
        }).join("") + "</ol>";
    var eta = "";
    if (["new", "confirmed", "preparing"].indexOf(o.status) >= 0 && o.store && o.store.prep_minutes) {
      var base = new Date(o.scheduled_for || at.confirmed || o.created_at);
      var t = new Date(base.getTime() + o.store.prep_minutes * 60000);
      eta = '<p class="eta">⏱ Listo aproximadamente a las ' + fmtTime(t.toISOString()) + (o.service === "delivery" ? " (más el tiempo de entrega)" : "") + "</p>";
    }
    var wa = o.store && o.store.whatsapp ? String(o.store.whatsapp).replace(/\D/g, "") : B.config.callCenter;
    $("#card").innerHTML =
      '<div class="row"><div class="code">' + esc(o.code) + "<small>" + (o.order_no ? "Pedido N.º " + esc(o.order_no) + " · " : "") + esc(o.store ? o.store.name : "") + "</small></div>" +
      '<span class="pill">' + (o.service === "delivery" ? "🛵 Delivery" : "🥢 Retiro") + "</span></div>" + tl + eta +
      '<ul class="items">' + (o.items || []).map(function (i) { return "<li><span>" + esc(i.qty) + "× " + esc(i.name) + "</span></li>"; }).join("") + "</ul>" +
      '<div class="tot"><span>Total</span><span>' + money(o.total) + "</span></div>" +
      '<a class="btn" href="https://wa.me/' + wa + "?text=" + encodeURIComponent("Hola Hattori 👋 Consulta sobre mi pedido " + o.code) + '" target="_blank" rel="noopener">Preguntar por ' + esc(o.code) + "</a>";
    if (o.status === "delivered" || o.status === "cancelled") clearInterval(timer);
  }
  async function load() {
    if (!CFG.supabaseUrl || !CFG.supabaseKey) return notFound("El seguimiento en vivo todavía no está activado.");
    try {
      var r = await fetch(CFG.supabaseUrl.replace(/\/$/, "") + "/rest/v1/rpc/track_order", {
        method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.supabaseKey, Authorization: "Bearer " + CFG.supabaseKey },
        body: JSON.stringify({ token: token }),
      });
      var j = await r.json();
      if (!r.ok || !j || !j.ok) return notFound();
      render(j);
    } catch (e) { $("#s").textContent = "Sin conexión. Reintentamos en unos segundos…"; }
  }
  if (!UUID.test(token)) notFound();
  else { load(); timer = setInterval(load, 15000); }
})();
</script>
</body>
</html>
